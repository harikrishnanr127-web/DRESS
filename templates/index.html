<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ bot_name }} - Fashion Study Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bottle: #0f4a3c;
      --bottle-deep: #0a3329;
      --paper: #f0eaf7;
      --white: #fdfcff;
      --ink: #1d1a26;
      --ink-soft: #675f78;
      --thread: #d6246e;
      --tape: #f2d24b;
      --line: #d9d0e6;
      --display: "Cormorant Garamond", Georgia, serif;
      --body: "Hanken Grotesk", "Segoe UI", sans-serif;
      --mono: ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bottle);
      display: flex;
      justify-content: center;
      padding: 22px;
    }

    .atelier {
      width: 100%;
      max-width: 860px;
      display: flex;
      flex-direction: column;
      background: var(--paper);
      border-radius: 6px;
      box-shadow: 10px 10px 0 var(--bottle-deep);
      overflow: hidden;
    }

    .masthead { padding: 22px 30px 14px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }

    .masthead h1 {
      font-family: var(--display);
      font-size: clamp(38px, 6vw, 56px);
      font-weight: 700;
      font-style: italic;
      line-height: 0.95;
      color: var(--bottle);
    }

    .masthead p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }

    .reset {
      font-family: var(--body);
      font-size: 14px;
      font-weight: 500;
      color: var(--bottle);
      background: none;
      border: 1.5px solid var(--bottle);
      border-radius: 999px;
      padding: 6px 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .reset:hover, .reset:focus-visible { background: var(--bottle); color: var(--paper); outline: none; }

    .tape {
      height: 30px;
      background:
        repeating-linear-gradient(90deg, rgba(29, 26, 38, 0.7) 0 1.5px, transparent 1.5px 60px) bottom / 100% 16px no-repeat,
        repeating-linear-gradient(90deg, rgba(29, 26, 38, 0.55) 0 1px, transparent 1px 12px) bottom / 100% 9px no-repeat,
        var(--tape);
      border-top: 1px solid rgba(29, 26, 38, 0.25);
      border-bottom: 1px solid rgba(29, 26, 38, 0.25);
    }

    .swatches {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 14px 30px;
      border-bottom: 1px solid var(--line);
    }

    .swatch {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--body);
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      color: var(--ink);
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 15px 5px 6px;
      cursor: pointer;
    }

    .swatch:hover, .swatch:focus-visible { border-color: var(--thread); outline: none; }

    .swatch i {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 40%, var(--paper) 1.6px, transparent 2px),
        radial-gradient(circle at 62% 40%, var(--paper) 1.6px, transparent 2px),
        radial-gradient(circle at 38% 62%, var(--paper) 1.6px, transparent 2px),
        radial-gradient(circle at 62% 62%, var(--paper) 1.6px, transparent 2px),
        var(--dot, var(--thread));
    }

    .messages {
      height: min(52vh, 460px);
      overflow-y: auto;
      padding: 24px 30px 10px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .msg { max-width: 84%; }
    .msg.user { align-self: flex-end; }

    .bubble { padding: 14px 20px; overflow-wrap: anywhere; }

    .msg.bot .bubble {
      background: var(--white);
      border-radius: 4px;
      outline: 2px dashed var(--thread);
      outline-offset: -7px;
      padding: 16px 22px;
    }

    .msg.user .bubble {
      background: var(--bottle);
      color: var(--paper);
      border-radius: 4px;
      outline: 2px dashed rgba(240, 234, 247, 0.55);
      outline-offset: -6px;
      padding: 13px 20px;
      font-weight: 500;
    }

    .msg.error .bubble { outline-color: #a3221a; color: #a3221a; }

    .bubble p + p, .bubble p + ul, .bubble ul + p, .bubble p + pre, .bubble ul + pre, .bubble pre + p { margin-top: 9px; }
    .bubble ul { padding-left: 20px; }
    .bubble li + li { margin-top: 3px; }
    .bubble li::marker { color: var(--thread); }
    .bubble strong { font-weight: 600; color: var(--bottle); }

    .bubble code {
      font-family: var(--mono);
      font-size: 0.86em;
      background: #ece4f5;
      padding: 1px 5px;
      border-radius: 3px;
    }

    .bubble pre {
      background: var(--ink);
      color: #efe9f8;
      border-radius: 4px;
      padding: 12px 14px;
      overflow-x: auto;
    }

    .bubble pre code { background: none; padding: 0; color: inherit; }

    .stitching { padding: 20px 26px; }

    .stitching span {
      display: block;
      height: 3px;
      width: 0;
      background: repeating-linear-gradient(90deg, var(--thread) 0 9px, transparent 9px 15px);
      animation: sew 1.6s ease-in-out infinite;
    }

    @keyframes sew {
      0% { width: 0; }
      80%, 100% { width: 130px; }
    }

    .composer {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding: 14px 30px 24px;
    }

    .composer textarea {
      flex: 1;
      font-family: var(--body);
      font-size: 16px;
      line-height: 1.4;
      color: var(--ink);
      background: var(--white);
      border: 1.5px solid var(--line);
      border-radius: 22px;
      padding: 12px 20px;
      resize: none;
      max-height: 130px;
    }

    .composer textarea:focus { outline: none; border-color: var(--bottle); }
    .composer textarea::placeholder { color: #9d95ad; }

    .send {
      width: 50px;
      height: 50px;
      flex-shrink: 0;
      display: grid;
      place-items: center;
      background: var(--thread);
      border: none;
      border-radius: 50%;
      box-shadow: inset 0 0 0 4px var(--thread), inset 0 0 0 6px rgba(255, 255, 255, 0.7);
      cursor: pointer;
    }

    .send svg { width: 20px; height: 20px; }
    .send:hover:not(:disabled) { background: #b81c5c; }
    .send:focus-visible { outline: 3px solid var(--bottle); outline-offset: 3px; }
    .send:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 640px) {
      body { padding: 0; }
      .atelier { max-width: none; height: 100%; border-radius: 0; box-shadow: none; }
      main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      .masthead, .swatches, .messages, .composer { padding-left: 16px; padding-right: 16px; }
      .masthead p { display: none; }
      .messages { height: auto; flex: 1; min-height: 0; }
      .msg { max-width: 94%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stitching span { animation: none; width: 130px; }
      .messages { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div class="atelier">
    <header class="masthead">
      <div>
        <h1>{{ bot_name }}</h1>
        <p>Fashion and dress study assistant</p>
      </div>
      <button class="reset" id="clearBtn" type="button">New fitting</button>
    </header>

    <div class="tape" aria-hidden="true"></div>

    <nav class="swatches" aria-label="Suggested topics">
      <button class="swatch" style="--dot:#d6246e" data-prompt="Explain the main dress silhouettes such as A-line, sheath, empire and mermaid.">Dress silhouettes</button>
      <button class="swatch" style="--dot:#0f4a3c" data-prompt="What is the difference between woven and knit fabrics?">Woven vs knit</button>
      <button class="swatch" style="--dot:#e0a526" data-prompt="Explain the color wheel and how designers build a color palette.">Color palette</button>
      <button class="swatch" style="--dot:#5b3fa0" data-prompt="What are darts in pattern making and why are they used?">Darts</button>
      <button class="swatch" style="--dot:#2a6fb0" data-prompt="Give an overview of how fashion changed in the 1920s.">1920s fashion</button>
    </nav>

    <main>
      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a fashion study question" aria-label="Your question"></textarea>
        <button class="send" id="sendBtn" type="button" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12h15M13 6l6 6-6 6"/>
          </svg>
        </button>
      </div>
    </main>
  </div>

  <script>
    const GREETING = {{ greeting | tojson }};

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let history = [];
    let busy = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inline(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
    }

    function render(text) {
      const lines = text.split("\n");
      let html = "";
      let inList = false;
      let inCode = false;

      for (const raw of lines) {
        if (raw.trim().startsWith("```")) {
          if (inList) { html += "</ul>"; inList = false; }
          html += inCode ? "</code></pre>" : "<pre><code>";
          inCode = !inCode;
          continue;
        }

        if (inCode) {
          html += escapeHtml(raw) + "\n";
          continue;
        }

        const line = raw.trim();
        const item = line.match(/^(?:[-*]|\d+\.)\s+(.*)$/);

        if (item) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(item[1]) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line) html += "<p>" + inline(line.replace(/^#+\s*/, "")) + "</p>";
        }
      }

      if (inList) html += "</ul>";
      if (inCode) html += "</code></pre>";
      return html;
    }

    function addMessage(role, text, isError = false) {
      const wrap = document.createElement("div");
      wrap.className = "msg " + role + (isError ? " error" : "");

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (role === "user") bubble.textContent = text;
      else bubble.innerHTML = render(text);

      wrap.appendChild(bubble);
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.innerHTML = '<div class="bubble stitching" aria-label="Thinking"><span></span></div>';
      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return wrap;
    }

    function setBusy(state) {
      busy = state;
      sendBtn.disabled = state;
    }

    async function send(text) {
      const message = text.trim();
      if (!message || busy) return;

      addMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      setBusy(true);

      const typing = addTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, history })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          addMessage("bot", data.error || "Something went wrong.", true);
        } else {
          addMessage("bot", data.reply);
          history.push({ role: "user", text: message }, { role: "bot", text: data.reply });
        }
      } catch (error) {
        typing.remove();
        addMessage("bot", "Could not reach the server. Check your connection and try again.", true);
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function resetChat() {
      history = [];
      messagesEl.innerHTML = "";
      addMessage("bot", GREETING);
    }

    sendBtn.addEventListener("click", () => send(inputEl.value));

    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        send(inputEl.value);
      }
    });

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + "px";
    });

    clearBtn.addEventListener("click", resetChat);

    document.querySelectorAll(".swatch").forEach((button) => {
      button.addEventListener("click", () => send(button.dataset.prompt));
    });

    resetChat();
  </script>
</body>
</html>
